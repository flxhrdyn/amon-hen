name: Bug Report
description: Report an issue or unexpected behavior in Amon Hen
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Amon Hen Version
      description: What version of Amon Hen are you using? (e.g. `amon-hen --version` or git commit hash)
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (Ubuntu/Debian/Fedora/etc.)
        - macOS (Apple Silicon - M1/M2/M3/M4)
        - macOS (Intel)
        - Windows 10 / 11
        - Other
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: e.g. Python 3.12.2
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or CLI command to reproduce the behavior.
      placeholder: |
        1. Run `amon-hen index my_video.mp4`
        2. Run `amon-hen search "a red car"`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste any error traceback or terminal output here.
      render: shell

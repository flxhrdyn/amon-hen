[project]
name = "amon-hen"
version = "0.1.13"
description = "Local, CPU-only video moment retrieval from the command line"













readme = "README_PYPI.md"
requires-python = ">=3.11"

license = { text = "MIT" }
authors = [
    { name = "Felix Hardyan", email = "felix@felixhrdyn.com" },
]
keywords = [
    "video-retrieval",
    "video-search",
    "computer-vision",
    "clip",
    "mobileclip",
    "onnx",
    "onnxruntime",
    "sqlite-vec",
    "multimodal",
    "semantic-search",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "pillow>=10.0",
    "sqlite-vec>=0.1.6",
    "imageio-ffmpeg>=0.5",
    "typer>=0.12",
    "huggingface-hub>=0.24",
    "tokenizers>=0.20",
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/flxhrdyn/amon-hen"
Repository = "https://github.com/flxhrdyn/amon-hen"
Issues = "https://github.com/flxhrdyn/amon-hen/issues"
Changelog = "https://github.com/flxhrdyn/amon-hen/blob/main/CHANGELOG.md"
"Model Hub" = "https://huggingface.co/felixhrdyn/mobileclip2-s0-onnx"

[project.scripts]
amon-hen = "amonhen.cli:app"


[dependency-groups]
dev = [
    "onnx>=1.22.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amonhen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-m 'not slow'"
markers = [
    "slow: requires the real model or real video decoding",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's documented usage puts typer.Argument()/typer.Option() calls in
# parameter defaults; that is not the mutable-default-argument bug B008
# otherwise catches.
"src/amonhen/cli.py" = ["B008"]
"benchmarks/run.py" = ["B008"]
"demo/*" = ["E501", "I"]
"tools/*" = ["E501"]

